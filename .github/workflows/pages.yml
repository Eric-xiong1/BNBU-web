name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure authoritative Backend
        if: ${{ vars.BNBU_API_BASE_URL != '' }}
        env:
          BNBU_API_BASE_URL: ${{ vars.BNBU_API_BASE_URL }}
        run: node frontend/generate-student-runtime-config.cjs
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
