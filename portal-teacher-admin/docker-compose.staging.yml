name: bnbu-sports-web-staging

services:
  portal:
    image: ${PORTAL_IMAGE:?Set an immutable portal image reference}
    ports:
      - 127.0.0.1:${PORTAL_BIND_PORT:-3100}:3100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
